baseURL = "https://example.org/"
title = "疮痂之歌"
languageCode = "zh"
DefaultContentLanguage = "zh"
enableInlineShortcodes = true
theme = "vnovel"
enableRobotsTXT = true
hasCJKLanguage = true

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true

[params]
paginator_pages = "5"

# Site logo.
logo = "/img/logo.webp"

  [params.homepage_meta_tags]
    meta_description = "Cantilena Melancholica Rerum Imperfectarum"
    meta_og_title = "疮痂之歌"
    meta_og_type = "website"
    meta_og_image = "https://vnovel.pages.dev/img/fern.webp"

[outputs]
  home = ["HTML", "JSON"]

[outputFormats]
  [outputFormats.JSON]
    name = "JSON"
    mediaType = "application/json"
    baseName = "index"
    isPlainText = true
    notAlternative = true

googleAnalytics = ""